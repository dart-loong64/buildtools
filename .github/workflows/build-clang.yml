name: Build Flutter Clang

on:
  workflow_dispatch:
    inputs:
      flutter_tag:
        description: Flutter tag or commit to use
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Flutter
        uses: actions/checkout@v7
        with:
          repository: dart-loong64/flutter
          ref: ${{ inputs.flutter_tag }}

      - name: Install build and cross tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git \
            libxml2-dev \
            lld ninja-build

      - name: Build and package Clang
        run: |
          mkdir -p engine/src/flutter/buildtools
          wget -qO engine/src/flutter/buildtools/build-clang.sh https://github.com/${{ github.repository }}/raw/refs/heads/main/build-clang.sh
          chmod +x engine/src/flutter/buildtools/build-clang.sh
          ./engine/src/flutter/buildtools/build-clang.sh

      - name: Upload Clang archives
        uses: actions/upload-artifact@v7
        with:
          name: clang-linux-${{ matrix.arch }}
          path: dist/clang-linux-*.tar.*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          pattern: clang-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          TAG_NAME: ${{ inputs.flutter_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG_NAME}" \
            --generate-notes \
            --title "${TAG_NAME}" \
            dist/*
